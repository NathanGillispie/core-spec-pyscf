name: PySCF compatibility

on:
  push:
    branches:
      - 'main'
      - $default-branch
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PySCF 2.7
            python_version: '3.10'
            pyscf_requirement: 'pyscf==2.7.*'
            pytest_args: '--ignore=pyscf/cvs'
          - name: PySCF 2.10
            python_version: '3.10'
            pyscf_requirement: 'pyscf==2.10.*'
            pytest_args: ''
          - name: PySCF 2.14
            python_version: '3.12'
            pyscf_requirement: 'pyscf==2.14.*'
            pytest_args: ''

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python_version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov geometric
        python -m pip install --only-binary=pyscf \
          "${{ matrix.pyscf_requirement }}"
        python -m pip install -e .
    - name: Test
      run: |
        export PYSCF_EXT_PATH=$(pwd):$PYSCF_EXT_PATH
        python -m pytest -s --cov-report=json ${{ matrix.pytest_args }}
