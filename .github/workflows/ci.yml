name: pytest

on:
  push:
    branches:
      - 'main'
      - $default-branch
  pull_request:
    branches:
      - 'main'
      - $default-branch

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.13
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest
        pip install geometric
        # GHF/GKS analytic gradients ship in PySCF 2.15. Use master until then.
        if pip install "pyscf>=2.15"; then
          echo "Using PySCF >= 2.15 from PyPI"
        else
          echo "PySCF 2.15 is not on PyPI yet; installing from git master"
          # Git installs compile C extensions; GitHub Ubuntu images have no BLAS.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake g++ gfortran libopenblas-dev
          CMAKE_CONFIGURE_ARGS="-DBLA_VENDOR=OpenBLAS" \
            pip install "git+https://github.com/pyscf/pyscf.git"
        fi
        pip install -e .
    - name: Test
      run: |
        export PYSCF_EXT_PATH=$(pwd):$PYSCF_EXT_PATH
        pytest -s pyscf/zora
        pytest -s pyscf/cvs
