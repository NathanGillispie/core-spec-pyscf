name: pytest

on:
  push:
    branches:
      - 'main'
      - $default-branch
  pull_request:

permissions:
  contents: read

jobs:
  latest:
    name: Tests with PySCF master

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov geometric
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          cmake g++ gfortran libopenblas-dev
        CMAKE_CONFIGURE_ARGS="-DBLA_VENDOR=OpenBLAS" \
          python -m pip install "git+https://github.com/pyscf/pyscf.git"
        python -m pip install -e .
    - name: Test
      run: |
        export PYSCF_EXT_PATH=$(pwd):$PYSCF_EXT_PATH
        python -m pytest -s --cov-report=json

  compatibility:
    name: Tests with PySCF 2.14

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov geometric
        python -m pip install "pyscf==2.14.*"
        python -m pip install -e .
    - name: Test
      run: |
        export PYSCF_EXT_PATH=$(pwd):$PYSCF_EXT_PATH
        python -m pytest -s --cov-report=json
