[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["pyscf.*"]
exclude = ["pyscf.*.test", "pyscf.*.test.*"]

[tool.pytest.ini_options]
testpaths = ["pyscf"]
addopts = [
    "--cov=pyscf/cvs",
    "--cov=pyscf/qr",
    "--cov=pyscf/zora",
    "--cov-report=term-missing",
]

[tool.coverage.run]
source = ["pyscf/cvs", "pyscf/qr", "pyscf/zora"]
omit = ["*/test/*"]

[project]
name = "core-spec-pyscf"
version = "0.4"
authors = [
    { name = "Nathan Gillispie", email = "nwgllspe@memphis.edu" }
]
description = "PySCF extension for easier access to core-level spectroscopy calculations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyscf>=2.7"]
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  'Development Status :: 3 - Alpha',
  'Intended Audience :: Science/Research',
  'Topic :: Scientific/Engineering :: Chemistry',
  'Operating System :: POSIX',
  'Operating System :: Unix',
  'Operating System :: MacOS',
]

[project.optional-dependencies]
cvs = ["pyscf>=2.10"]

[project.urls]
Homepage = "https://github.com/NathanGillispie/core-spec-pyscf"
Issues = "https://github.com/NathanGillispie/core-spec-pyscf/issues"

